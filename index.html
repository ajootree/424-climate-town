<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#302d24">
  <meta name="description" content="그림으로 보고, 모험하며 배우는 기후 수호대. 도입부와 햇살마을의 다섯 퀘스트.">
  <title>다섯 마을 수호대 · 햇살마을</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="assets/fonts/nexon-lv1-bold.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="assets/fonts/nexon-lv2-regular.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="assets/fonts/nexon-lv2-bold.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="style.css?v=nexon-1">
</head>
<body>
  <main id="game-shell" aria-label="다섯 마을 수호대 게임">
    <canvas id="game" tabindex="0" aria-label="횡스크롤 게임. 방향키로 이동, 스페이스로 점프, Z로 공격, X로 스킬, E로 대화, Q로 기력 충전."></canvas>
    <div id="loading" role="status"><strong>다섯 마을 수호대</strong><span>그림과 모험을 준비하고 있어요…</span><progress id="load-progress" max="100" value="0"></progress></div>
    <div id="rotate"><strong>가로로 돌려주세요</strong><span>넓게 펼쳐지는 모험이 기다려요.</span></div>
    <div id="live" role="status" aria-live="polite"></div>
    <div id="accessible-controls" aria-label="게임 조작">
      <button id="a-left" aria-label="왼쪽 이동">왼쪽</button><button id="a-right" aria-label="오른쪽 이동">오른쪽</button>
      <button id="a-jump">점프</button><button id="a-attack">공격</button><button id="a-interact">대화 또는 조사</button><button id="a-charge">기력 충전</button>
    </div>
  </main>
  <script type="module" src="game.js?v=ribbon-1"></script>
</body>
</html>
